# ============================================================
# Terbitkan Peta Dunia ke GitHub Pages
# ------------------------------------------------------------
# Alur ini menyalakan GitHub Pages SENDIRI (jadi tidak perlu
# menekan tombol di Settings) lalu menerbitkan isi repo sebagai
# halaman web.
#
# Yang disertakan: index.html (pengalih) + folder app/ (aplikasi).
# Yang TIDAK disertakan: backups/ dan catat/ (arsip besar, tidak
# dipakai aplikasi).
#
# Halaman jadi: https://<akun>.github.io/<repo>/
# ============================================================
name: Terbitkan Peta Dunia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.terbit.outputs.page_url }}
    steps:
      - name: Ambil berkas repo
        uses: actions/checkout@v4

      - name: Susun berkas situs (tanpa arsip besar)
        run: |
          mkdir -p _situs
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='backups' \
            --exclude='catat' \
            --exclude='_situs' \
            ./ _situs/
          echo "--- isi yang diterbitkan ---"
          find _situs -maxdepth 2 | sort

      - name: Siapkan Pages (nyalakan bila belum aktif)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Bungkus berkas situs
        uses: actions/upload-pages-artifact@v3
        with:
          path: _situs

      - name: Terbitkan
        id: terbit
        uses: actions/deploy-pages@v4
